---
# Ensures all the operator artifacts are created and waits for CSV to succeed.
#
# NOTE: Do NOT test by checking for presence of API resources in the
#       keycloak.org API group. They do not always get cleaned up.
#
# TODO: for some reason this does not detect a web-console-deployed RHSSO op.
#
- name: Check if the RHBK CSV exists already
  k8s_info:
    kubeconfig: tmp/kubeconfig-ocp4
    validate_certs: no
    api_version: operators.coreos.com/v1alpha1
    kind: clusterserviceversion
  register: all_csv

- name: Find RHBK CSV among all CSVs
  set_fact:
    rhbk_csv: "{{ (all_csv | community.general.json_query(\"resources[?metadata.name == 'rhbk-operator.v26.0.7-opr.1']\")) }}"
  when:
    - all_csv.resources is defined
    - (all_csv.resources | length) > 0

- name: Get details about RHBK CSV if found
  set_fact:
    rhsso_csv_ns: "{{ rhbk_csv[0] | community.general.json_query('metadata.namespace') }}"
    rhsso_csv_name: "{{ rhbk_csv[0] | community.general.json_query('metadata.name') }}"
  when:
    - rhbk_csv is defined
    - (rhbk_csv | length) > 0

- assert:
    that:
      - ((rhbk_csv_ns | default("")) == "") or ((rhbk_csv_ns | default("")) == "rhbk")
      - ((rhbk_csv_name | default("")) == "") or ((rhsso_csv_name | default("")) == "rhbk-operator.v26.0.7-opr.1")
    fail_msg: "ERROR: RHBK CSV already present in {{ rhbk_csv_ns | default('NA') }}/{{ rhBK_csv_name | default('NA') }} - please remove manually!"
    success_msg: "OK: RHBK CSV not present or configured correctly."

- name: Make sure the namespace is there
  k8s:
    kubeconfig: tmp/kubeconfig-ocp4
    validate_certs: no
    api_version: v1
    kind: namespace
    name: rhbk

- name: Make sure it has a properly configured OperatorGroup
  k8s:
    kubeconfig: tmp/kubeconfig-ocp4
    validate_certs: no
    api_version: operators.coreos.com/v1
    kind: operatorgroup
    namespace: rhbk
    name: rhbk
    definition:
      spec:
        targetNamespaces:
          - rhbk

- name: Also make sure there is a subscription
  k8s:
    kubeconfig: tmp/kubeconfig-ocp4
    validate_certs: no
    api_version: operators.coreos.com/v1alpha1
    kind: subscription
    namespace: rhbk
    name: rhbk-subscription
    definition:
      spec:
        source: rh-ws-catalog
        sourceNamespace: openshift-marketplace
        name: rhbk-operator
        channel: training
        installPlanApproval: Automatic
        startingCSV: rhbk-operator.v26.0.7-opr.1

- name: Wait for installPlan to show up
  k8s_info:
    kubeconfig: tmp/kubeconfig-ocp4
    validate_certs: no
    api_version: operators.coreos.com/v1alpha1
    kind: installplan
    namespace: rhbk
  register: rhbk_ip
  until:
    - rhbk_ip.resources is defined
    - (rhbk_ip.resources | length) > 0
    - rhbk_ip.resources[0].spec.approved
  retries: 12
  delay: 10

- name: Wait for CSV to show up and complete
  k8s_info:
    kubeconfig: tmp/kubeconfig-ocp4
    validate_certs: no
    api_version: operators.coreos.com/v1alpha1
    kind: clusterserviceversion
    namespace: rhbk
  register: rhbk_csv
  until:
    - rhbk_csv.resources is defined
    - (rhbk_csv.resources | length) > 0
    - rhbk_csv.resources[0].status is defined
    - rhbk_csv.resources[0].status.phase == "Succeeded"
  retries: 30
  delay: 10

- name: Finally, wait for the pod
  k8s_info:
    kubeconfig: tmp/kubeconfig-ocp4
    validate_certs: no
    api_version: v1
    kind: pod
    namespace: rhbk
    label_selectors:
      - name = rhbk-operator
  register: rhbk_pod
  until:
    - rhbk_pod.resources is defined
    - (rhbk_pod.resources | length) > 0
    - rhbk_pod.resources[0].status is defined
    - rhbk_pod.resources[0].status.phase == "Running"
  retries: 30
  delay: 10
...
