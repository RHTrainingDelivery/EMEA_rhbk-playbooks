---
# Variables affecting this role:
#
#  tools:
#    - final_name: the path to the tool to check for
#      completion: look for bash_completion or no
#      completion_file: the name of the bash completion file
#  clusters:
#   just a simple list of clusters to check
#
#
- name: Check RHBK {{ rhbk_n }} ZIP is there
  stat:
    path: "{{ ansible_facts['user_dir'] }}/Downloads/rhbk-{{ rhbk_n }}.zip"
  register: rhbk_new_version
  when: standalone|bool

- assert:
    that: rhbk_new_version.stat.exists
    fail_msg: "ERROR: RHBK {{ rhbk_n }} ZIP not downloaded! Please go to section 'Before You Begin' in your book."
    success_msg: "OK: Found RHBK {{ rhbk_n }} ZIP file."
  when: standalone|bool

- name: Check RHBK {{ rhbk_p }} is there
  stat:
    path: "{{ ansible_facts['user_dir'] }}/Downloads/rhbk-{{ rhbk_p }}-patch.zip"
  register: rhbk_old_version
  when: standalone|bool

- assert:
    that: rhbk_old_version.stat.exists
    fail_msg: "ERROR: RHBK {{ rhbk_p }} not downloaded! Please go to section 'Before You Begin' in your book."
    success_msg: "OK: Found RHBK {{ rhbk_p}} file."
  when: standalone|bool

- name: Make sure kubeconfig is there on utility
  delegate_to: utility.lab.example.com
  file:
    path: /home/lab/{{ item }}/auth/kubeconfig
    state: file
  loop: "{{ clusters }}"

- name: Create a temp dir
  file:
    path: tmp
    state: directory

- name: Copy over the kubeconfig
  delegate_to: utility.lab.example.com
  fetch:
    src: /home/lab/{{ item }}/auth/kubeconfig
    dest: tmp/kubeconfig-{{ item }}
    flat: yes
  loop: "{{ clusters }}"

- name: "We need python-kubernetes >= 12"
  become: yes
  pip:
    name: kubernetes>=12.0.0

# XXX This won't do if you install it using pip.
- name: We also need python3.11-jmespath
  become: yes
  package:
    name: python3.11-jmespath
    state: latest

- name: Remove older Java Versions
  become: yes
  package:
    name: java-*
    state: absent

- name: Install EPEL Release
  become: yes
  package:
    name: epel-release
    state: latest

- name: Install Java 21 SDK
  become: yes
  package:
    name: java-latest-openjdk-portable-devel
    state: latest

- name: Correct java version selected
  become: yes 
  command: alternatives --auto java

- name: Verify cluster connectivity
  kubernetes.core.k8s_cluster_info:
    kubeconfig: tmp/kubeconfig-{{ item }}
    validate_certs: no
  loop: "{{ clusters }}"
...
